name: 서버 배포

on:
  push:
    branches: [ main ]
    paths:
      - "server/**"
      - ".github/workflows/server-deploy.yml"
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/server

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: 린트
        working-directory: server
        run: ./gradlew ktlintCheck

      - name: 테스트
        working-directory: server
        run: ./gradlew test

      - name: 테스트 결과 요약
        if: always()
        working-directory: server
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET

          total = failures = errors = skipped = 0
          failed = []

          for path in glob.glob("build/test-results/test/*.xml"):
              suite = ET.parse(path).getroot()
              total += int(suite.get("tests", 0))
              failures += int(suite.get("failures", 0))
              errors += int(suite.get("errors", 0))
              skipped += int(suite.get("skipped", 0))
              for case in suite.iter("testcase"):
                  if case.find("failure") is not None or case.find("error") is not None:
                      failed.append(f"{case.get('classname')} > {case.get('name')}")

          passed = total - failures - errors - skipped
          print(f"### 테스트 {total}개, 성공 {passed}, 실패 {failures + errors}, 건너뜀 {skipped}")

          for name in failed:
              print(f"- ❌ `{name}`")
          EOF

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: jar 빌드와 레이어 추출
        working-directory: server
        run: |
          ./gradlew bootJar --no-daemon -x test
          java -Djarmode=tools -jar build/libs/app.jar extract --layers --destination build/extracted

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 이름 정하기
        id: meta
        run: |
          echo "image=${IMAGE_NAME,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE_NAME,,}:latest" >> "$GITHUB_OUTPUT"

      - name: 이미지 빌드와 푸시
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: server
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: 설정 파일 올리기
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "server/docker-compose.yml,server/caddy/Caddyfile"
          target: "~/jipkok"
          strip_components: 1

      - name: 배포
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/jipkok
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export SERVER_IMAGE="${{ needs.build.outputs.image }}"
            docker compose pull server
            docker compose up -d --wait --remove-orphans
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker image prune -af --filter "until=168h"
