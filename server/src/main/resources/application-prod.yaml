server:
  port: 8080
  shutdown: graceful

spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: gpt-5-mini
        temperature: 0.0

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  jackson:
    default-property-inclusion: non_null

  web:
    error:
      include-message: always
      include-binding-errors: always

logging:
  pattern:
    correlation: "[%X{requestId:-}] "
  structured:
    format:
      console: ecs
  level:
    com.blueoauld.server: info
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 1h
  refresh-token-validity: 14d

admob:
  verifier-keys-url: ${ADMOB_VERIFIER_KEYS_URL:https://www.gstatic.com/admob/reward/verifier-keys.json}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

r2:
  enabled: ${R2_ENABLED:true}
  endpoint: ${R2_ENDPOINT}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  bucket: ${R2_BUCKET}
  public-base-url: ${R2_PUBLIC_BASE_URL}
  upload-url-validity: 10m
  view-url-validity: 10m

solapi:
  api-key: ${SOLAPI_API_KEY:}
  api-secret: ${SOLAPI_API_SECRET:}
  sender-number: ${SOLAPI_SENDER_NUMBER:}

discord:
  token: ${DISCORD_TOKEN:}
  guild-id: ${DISCORD_GUILD_ID:}
  role-id: ${DISCORD_ROLE_ID:}
  suspension-channel-id: ${DISCORD_SUSPENSION_CHANNEL_ID:}
  reset-channel-id: ${DISCORD_RESET_CHANNEL_ID:}
  report-channel-id: ${DISCORD_REPORT_CHANNEL_ID:}
  moderation-channel-id: ${DISCORD_MODERATION_CHANNEL_ID:}
