spring:
    application:
        name: server

    messages:
        basename: messages
        encoding: UTF-8
        fallback-to-system-locale: false

    profiles:
        default: local

    ai:
        openai:
            chat:
                model: gpt-5.6-luna

    datasource:
        driver-class-name: org.postgresql.Driver
        hikari:
            maximum-pool-size: 10
            connection-timeout: 3000

    flyway:
        baseline-on-migrate: true
        baseline-version: 0

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        properties:
            hibernate:
                format_sql: false
                default_batch_fetch_size: 100
                jdbc:
                    batch_size: 100

    data:
        redis:
            repositories:
                enabled: false

    lifecycle:
        timeout-per-shutdown-phase: 20s

    jackson:
        default-property-inclusion: non_null

    web:
        error:
            include-message: always
            include-binding-errors: always

management:
    endpoints:
        web:
            base-path: /
            exposure:
                include: health
    endpoint:
        health:
            show-details: never

logging:
    pattern:
        correlation: "[%X{requestId:-}] "

server:
    port: 8080
    shutdown: graceful

cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

jwt:
    access-token-validity: 1h
    refresh-token-validity: 14d

admob:
    verifier-keys-url: ${ADMOB_VERIFIER_KEYS_URL:https://www.gstatic.com/admob/reward/verifier-keys.json}

r2:
    upload-url-validity: 10m
    view-url-validity: 10m

app-version:
    ios:
        latest: ${IOS_LATEST_VERSION:1.0.0}
        url: ${IOS_STORE_URL:https://apps.apple.com/app/id0000000000}
    android:
        latest: ${ANDROID_LATEST_VERSION:1.0.0}
        url: ${ANDROID_STORE_URL:https://play.google.com/store/apps/details?id=com.blueoauld.jipkok}
