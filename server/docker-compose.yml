services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-northeast-2}
        awslogs-group: /jipkok/caddy
        awslogs-create-group: "true"

  server:
    image: ${SERVER_IMAGE:-jipkok-server:latest}
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "8080" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    logging:
      driver: awslogs
      options:
        awslogs-region: ${AWS_REGION:-ap-northeast-2}
        awslogs-group: /jipkok/server
        awslogs-create-group: "true"

  redis:
    image: redis:8.4.0
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  caddy-data:
  caddy-config:
